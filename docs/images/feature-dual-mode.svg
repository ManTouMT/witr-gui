<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="popShadow">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1000" height="360" rx="12" fill="url(#bg2)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Left: Popover View -->
  <g transform="translate(60, 30)">
    <!-- Top Hint Tag -->
    <rect x="0" y="0" width="360" height="28" rx="6" fill="#1e293b"/>
    <text x="180" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">⚡ 场景 1：快捷键 Alt+W 唤起菜单栏秒级释放</text>

    <!-- Popover Container -->
    <g transform="translate(20, 42)" filter="url(#popShadow)">
      <rect width="320" height="230" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      
      <!-- Popover Header -->
      <rect width="320" height="40" rx="12" fill="#1e293b"/>
      <rect y="28" width="320" height="12" fill="#1e293b"/>
      <text x="16" y="25" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold">Witr 端口排障 (26 Active)</text>
      <circle cx="296" cy="20" r="4" fill="#10b981"/>

      <!-- Search in Popover -->
      <rect x="12" y="48" width="296" height="28" rx="6" fill="#090d16" stroke="#1e293b"/>
      <text x="24" y="66" fill="#64748b" font-family="ui-monospace, monospace" font-size="11">🔍 搜索 3000, 5173, node...</text>

      <!-- Popover Row 1 -->
      <rect x="12" y="84" width="296" height="42" rx="8" fill="#172554" stroke="#2563eb" stroke-width="1"/>
      <text x="22" y="104" fill="#60a5fa" font-family="ui-monospace, monospace" font-size="12" font-weight="bold">:5173</text>
      <text x="70" y="104" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="500">node (vite dev)</text>
      <rect x="236" y="93" width="62" height="24" rx="5" fill="#e11d48"/>
      <text x="267" y="109" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">释放端口</text>

      <!-- Popover Row 2 -->
      <rect x="12" y="132" width="296" height="42" rx="8" fill="#090d16" stroke="#1e293b"/>
      <text x="22" y="152" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="12" font-weight="bold">:8080</text>
      <text x="70" y="152" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">java (spring-boot)</text>
      <rect x="236" y="141" width="62" height="24" rx="5" fill="#334155"/>
      <text x="267" y="157" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500" text-anchor="middle">释放</text>

      <!-- Popover Bottom Hint -->
      <text x="160" y="210" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" text-anchor="middle">按 Cmd+Shift+W 展开全景工作台 →</text>
    </g>
  </g>

  <!-- Right: Full Workbench View -->
  <g transform="translate(520, 30)">
    <rect x="0" y="0" width="420" height="28" rx="6" fill="#1e293b"/>
    <text x="210" y="18" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">🖥️ 场景 2：快捷键 Cmd+Shift+W 唤起沉浸式深度分析</text>

    <!-- Mini Workbench Mockup -->
    <g transform="translate(0, 42)" filter="url(#popShadow)">
      <rect width="420" height="230" rx="12" fill="#090d16" stroke="#334155" stroke-width="1.5"/>
      
      <!-- Window top -->
      <rect width="420" height="28" rx="12" fill="#0f172a"/>
      <circle cx="16" cy="14" r="4" fill="#ef4444"/>
      <circle cx="28" cy="14" r="4" fill="#f59e0b"/>
      <circle cx="40" cy="14" r="4" fill="#10b981"/>
      <text x="60" y="18" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="bold">Witr Visual Workbench</text>

      <!-- Layout Split -->
      <rect x="0" y="28" width="110" height="202" fill="#0b0f19" stroke="#1e293b"/>
      <rect x="8" y="36" width="94" height="26" rx="4" fill="#172554"/>
      <text x="14" y="52" fill="#60a5fa" font-family="ui-monospace, monospace" font-size="9" font-weight="bold">:5173 node</text>

      <rect x="8" y="68" width="94" height="26" rx="4" fill="#1e293b"/>
      <text x="14" y="84" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9">:4001 QQ</text>

      <!-- Right detail area -->
      <text x="126" y="50" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold">因果溯源 + 环境变量 + 网络 Socket</text>
      
      <rect x="126" y="60" width="280" height="40" rx="6" fill="#1e1b4b" stroke="#6366f1"/>
      <text x="136" y="76" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9">launchd (PID: 1) → VS Code (PID: 1632)</text>
      <text x="136" y="90" fill="#c7d2fe" font-family="ui-monospace, monospace" font-size="9">>_ vite --host (Port: 5173)</text>

      <rect x="126" y="108" width="280" height="60" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <text x="136" y="124" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="bold">环境变量 (58 项) &amp; 网络 Socket (3 个)</text>
      <text x="136" y="140" fill="#64748b" font-family="ui-monospace, monospace" font-size="8">NODE_ENV=development | PORT=5173 | PATH=...</text>

      <rect x="126" y="178" width="80" height="24" rx="4" fill="#1e3a8a"/>
      <text x="166" y="194" fill="#bfdbfe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">VS Code 直达</text>

      <rect x="214" y="178" width="80" height="24" rx="4" fill="#3b0764"/>
      <text x="254" y="194" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Cursor 直达</text>

      <rect x="302" y="178" width="104" height="24" rx="4" fill="#881337"/>
      <text x="354" y="194" fill="#ffe4e6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">释放端口</text>
    </g>
  </g>
</svg>
