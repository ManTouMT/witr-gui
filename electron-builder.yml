appId: com.witr.gui
productName: Witr GUI
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - resources/**/*
extraResources:
  - from: resources/bin
    to: bin
mac:
  target:
    - target: default
      arch:
        - arm64
        - x64
  type: distribution
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
