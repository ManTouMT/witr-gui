<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="30" flood-color="#3b82f6" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="url(#bg)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="480"/>
    <line x1="600" y1="0" x2="600" y2="480"/>
    <line x1="900" y1="0" x2="900" y2="480"/>
  </g>

  <!-- Main Showcase Window Frame -->
  <g filter="url(#shadow)">
    <rect x="120" y="40" width="960" height="400" rx="16" fill="#090d16" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Titlebar -->
    <rect x="120" y="40" width="960" height="44" rx="16" fill="#0f172a"/>
    <rect x="120" y="68" width="960" height="16" fill="#0f172a"/>
    <line x1="120" y1="84" x2="1080" y2="84" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Traffic lights -->
    <circle cx="146" cy="62" r="6" fill="#ef4444"/>
    <circle cx="166" cy="62" r="6" fill="#f59e0b"/>
    <circle cx="186" cy="62" r="6" fill="#10b981"/>
    
    <!-- Title -->
    <rect x="210" y="52" width="20" height="20" rx="5" fill="#2563eb"/>
    <text x="220" y="66" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">W</text>
    <text x="240" y="66" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Witr Visual Workbench</text>
    
    <!-- Mode Pills -->
    <rect x="490" y="50" width="110" height="24" rx="6" fill="#2563eb"/>
    <text x="545" y="66" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">🌐 端口监听 (Ports)</text>
    
    <rect x="608" y="50" width="110" height="24" rx="6" fill="#1e293b"/>
    <text x="663" y="66" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" text-anchor="middle">⚡ 系统进程 (Proc)</text>

    <!-- Sidebar Left -->
    <rect x="120" y="84" width="240" height="356" fill="#0b0f19" stroke="#1e293b" stroke-width="1"/>
    <text x="140" y="112" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold">活跃端口列表 (26)</text>
    
    <!-- Sidebar Item 1 (Dev Port Active) -->
    <rect x="132" y="126" width="216" height="52" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="142" y="136" width="46" height="32" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <text x="165" y="156" fill="#34d399" font-family="ui-monospace, monospace" font-size="11" font-weight="bold" text-anchor="middle">:5173</text>
    <text x="198" y="150" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">node (vite)</text>
    <text x="198" y="164" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">PID: 37823 • lxy</text>

    <!-- Sidebar Item 2 -->
    <rect x="132" y="186" width="216" height="52" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <rect x="142" y="196" width="46" height="32" rx="6" fill="#1e293b"/>
    <text x="165" y="216" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11" font-weight="bold" text-anchor="middle">:4001</text>
    <text x="198" y="210" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">QQ</text>
    <text x="198" y="224" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">PID: 1283 • lxy</text>

    <!-- Sidebar Item 3 -->
    <rect x="132" y="246" width="216" height="52" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <rect x="142" y="256" width="46" height="32" rx="6" fill="#1e293b"/>
    <text x="165" y="276" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11" font-weight="bold" text-anchor="middle">:33331</text>
    <text x="198" y="270" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">clash-verge</text>
    <text x="198" y="284" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">PID: 1175 • lxy</text>

    <!-- Center Canvas: Causal Hierarchy Tree -->
    <g transform="translate(380, 96)">
      <text x="0" y="16" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold">🌲 双向因果血缘家族树 (Full Causal Process Tree)</text>
      <text x="0" y="32" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">追踪进程如何被启动 · 向上溯源祖先 · 向下展开衍生子进程</text>
      
      <!-- Timeline stem -->
      <line x1="12" y1="56" x2="12" y2="240" stroke="url(#blueGlow)" stroke-width="2"/>
      
      <!-- Step 1: launchd -->
      <circle cx="12" cy="62" r="5" fill="#8b5cf6" stroke="#c084fc" stroke-width="2"/>
      <rect x="30" y="46" width="380" height="42" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
      <text x="42" y="64" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="bold">根守护系统 (Root Init)</text>
      <text x="160" y="64" fill="#ffffff" font-family="ui-monospace, monospace" font-size="11" font-weight="bold">launchd (PID: 1)</text>
      <text x="42" y="78" fill="#818cf8" font-family="ui-monospace, monospace" font-size="9">>_ /sbin/launchd</text>

      <!-- Step 2: VS Code / Cursor -->
      <circle cx="12" cy="116" r="4" fill="#3b82f6"/>
      <rect x="30" y="100" width="380" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="42" y="118" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">中间父进程 (Parent L1)</text>
      <text x="170" y="118" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="11" font-weight="bold">Code Helper (PID: 1632)</text>
      <text x="42" y="132" fill="#64748b" font-family="ui-monospace, monospace" font-size="9">>_ /Applications/Visual Studio Code.app/...</text>

      <!-- Step 3: Target Process -->
      <circle cx="12" cy="170" r="6" fill="#3b82f6" stroke="#93c5fd" stroke-width="2"/>
      <rect x="30" y="152" width="380" height="52" rx="8" fill="#172554" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="42" y="172" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="bold">目标进程 (Target Process)</text>
      <text x="180" y="172" fill="#ffffff" font-family="ui-monospace, monospace" font-size="12" font-weight="bold">node :5173 (PID: 37823)</text>
      <text x="42" y="190" fill="#93c5fd" font-family="ui-monospace, monospace" font-size="9">>_ vite --host (witr-gui dev server)</text>
      <rect x="320" y="162" width="44" height="18" rx="4" fill="#1e3a8a"/>
      <text x="342" y="175" fill="#bfdbfe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" text-anchor="middle">VS Code</text>

      <!-- Step 4: Children Fork -->
      <circle cx="12" cy="226" r="4" fill="#a855f7"/>
      <rect x="30" y="212" width="380" height="38" rx="8" fill="#2e1065" stroke="#7e22ce" stroke-width="1"/>
      <text x="42" y="228" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="bold">派生子进程 (Subprocesses)</text>
      <text x="180" y="228" fill="#f3e8ff" font-family="ui-monospace, monospace" font-size="10">esbuild-darwin-arm64 (PID: 37840)</text>
      <text x="42" y="242" fill="#c084fc" font-family="ui-monospace, monospace" font-size="9">>_ /Users/lxy/.../esbuild service</text>
    </g>

    <!-- Bottom Dock Preview -->
    <g transform="translate(380, 360)">
      <rect x="0" y="0" width="670" height="68" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="22" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold">⚡ 智能安全操作坞 (Intelligent Action Dock)</text>
      <text x="16" y="44" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">工作目录: /Users/lxy/AIProjects/witr-gui  (Git: master)</text>
      
      <!-- Action Buttons -->
      <rect x="420" y="20" width="68" height="28" rx="6" fill="#1e3a8a" stroke="#2563eb" stroke-width="1"/>
      <text x="454" y="38" fill="#bfdbfe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" text-anchor="middle">VS Code</text>

      <rect x="496" y="20" width="58" height="28" rx="6" fill="#3b0764" stroke="#7e22ce" stroke-width="1"/>
      <text x="525" y="38" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Cursor</text>

      <rect x="562" y="20" width="96" height="28" rx="6" fill="#881337" stroke="#e11d48" stroke-width="1"/>
      <text x="610" y="38" fill="#ffe4e6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">释放端口 / 终止</text>
    </g>
  </g>
</svg>
