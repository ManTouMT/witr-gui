<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360">
  <defs>
    <linearGradient id="actBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="360" rx="12" fill="url(#actBg)" stroke="#1e293b" stroke-width="1.5"/>

  <text x="40" y="36" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="bold">🛡️ 智能防误杀保护与一键 IDE 源码直达 (Smart Actions &amp; Safeguards)</text>
  <text x="40" y="56" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">典型应用场景：杜绝手滑误杀系统关键守护进程；遇端口占用秒级释放或一键唤起 VS Code/Cursor 定位代码</text>

  <!-- Left: Safeguard Demo Card -->
  <g transform="translate(40, 80)">
    <rect width="430" height="250" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <text x="24" y="32" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold">🔒 机制 1：系统核心进程防误杀白名单</text>
    
    <g transform="translate(24, 48)">
      <rect width="382" height="74" rx="8" fill="#1e1b4b" stroke="#78350f" stroke-width="1"/>
      <text x="14" y="24" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold">⚠️ 受保护系统进程 (launchd, WindowServer, kernel_task)</text>
      <text x="14" y="44" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">自动禁用强杀操作，防止开发调试时误触导致 macOS 系统崩溃或注销。</text>
      <rect x="14" y="50" width="120" height="18" rx="4" fill="#451a03"/>
      <text x="74" y="63" fill="#fcd34d" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">系统保护锁定中</text>
    </g>

    <g transform="translate(24, 134)">
      <rect width="382" height="92" rx="8" fill="#1e293b"/>
      <text x="14" y="22" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold">⚡ 多级精准终止策略 (Context-Aware Stopping)</text>
      <text x="14" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">• 普通开发进程：优先 SIGTERM 优雅退出，超时支持 SIGKILL (-9)</text>
      <text x="14" y="60" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">• Docker 容器进程：自动执行 docker stop &lt;id&gt;</text>
      <text x="14" y="78" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">• PM2 托管进程：自动调用 pm2 stop &lt;name&gt;</text>
    </g>
  </g>

  <!-- Right: IDE Jump Demo Card -->
  <g transform="translate(530, 80)">
    <rect width="430" height="250" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <text x="24" y="32" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold">🚀 机制 2：一键工程环境直达 (1-Click Project Jump)</text>

    <!-- Mock process row with IDE buttons -->
    <g transform="translate(24, 48)">
      <rect width="382" height="90" rx="8" fill="#172554" stroke="#2563eb" stroke-width="1"/>
      <text x="14" y="24" fill="#60a5fa" font-family="ui-monospace, monospace" font-size="11" font-weight="bold">:5173 node (witr-gui dev server)</text>
      <text x="14" y="42" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10">工作区: /Users/lxy/AIProjects/witr-gui (Git: master)</text>
      
      <!-- Buttons -->
      <g transform="translate(14, 52)">
        <rect width="84" height="26" rx="5" fill="#1e3a8a" stroke="#3b82f6"/>
        <text x="42" y="68" fill="#bfdbfe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">VS Code</text>

        <rect x="94" width="76" height="26" rx="5" fill="#3b0764" stroke="#a855f7"/>
        <text x="132" y="68" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Cursor</text>

        <rect x="180" width="68" height="26" rx="5" fill="#334155"/>
        <text x="214" y="68" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500" text-anchor="middle">Finder</text>
      </g>
    </g>

    <g transform="translate(24, 150)">
      <rect width="382" height="76" rx="8" fill="#1e293b"/>
      <text x="14" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold">智能路径识别与过滤</text>
      <text x="14" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">自动识别真实 Git 代码仓库与工程目录；对系统根目录（/）智能屏蔽 IDE 打开，防止误触。</text>
    </g>
  </g>
</svg>
