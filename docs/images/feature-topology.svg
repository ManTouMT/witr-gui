<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360">
  <defs>
    <linearGradient id="topBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="nodeGlow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1000" height="360" rx="12" fill="url(#topBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Canvas Dot Matrix -->
  <g fill="#27272a">
    <circle cx="100" cy="60" r="1.5"/><circle cx="200" cy="60" r="1.5"/><circle cx="300" cy="60" r="1.5"/><circle cx="400" cy="60" r="1.5"/><circle cx="500" cy="60" r="1.5"/><circle cx="600" cy="60" r="1.5"/><circle cx="700" cy="60" r="1.5"/><circle cx="800" cy="60" r="1.5"/><circle cx="900" cy="60" r="1.5"/>
    <circle cx="100" cy="140" r="1.5"/><circle cx="200" cy="140" r="1.5"/><circle cx="300" cy="140" r="1.5"/><circle cx="400" cy="140" r="1.5"/><circle cx="500" cy="140" r="1.5"/><circle cx="600" cy="140" r="1.5"/><circle cx="700" cy="140" r="1.5"/><circle cx="800" cy="140" r="1.5"/><circle cx="900" cy="140" r="1.5"/>
    <circle cx="100" cy="220" r="1.5"/><circle cx="200" cy="220" r="1.5"/><circle cx="300" cy="220" r="1.5"/><circle cx="400" cy="220" r="1.5"/><circle cx="500" cy="220" r="1.5"/><circle cx="600" cy="220" r="1.5"/><circle cx="700" cy="220" r="1.5"/><circle cx="800" cy="220" r="1.5"/><circle cx="900" cy="220" r="1.5"/>
    <circle cx="100" cy="300" r="1.5"/><circle cx="200" cy="300" r="1.5"/><circle cx="300" cy="300" r="1.5"/><circle cx="400" cy="300" r="1.5"/><circle cx="500" cy="300" r="1.5"/><circle cx="600" cy="300" r="1.5"/><circle cx="700" cy="300" r="1.5"/><circle cx="800" cy="300" r="1.5"/><circle cx="900" cy="300" r="1.5"/>
  </g>

  <text x="40" y="36" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="bold">🕸️ 交互式 React Flow 进程拓扑网络 (Interactive Graph)</text>
  <text x="40" y="56" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">典型应用场景：直观审视微服务进程簇、多容器（Docker）依赖架构与大型树状调用网，支持自由拖拽、缩放与聚焦</text>

  <!-- Node 1: Root launchd -->
  <g transform="translate(60, 140)" filter="url(#nodeGlow)">
    <rect width="180" height="70" rx="10" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="14" y="24" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="bold">ROOT INIT</text>
    <text x="14" y="44" fill="#ffffff" font-family="ui-monospace, monospace" font-size="12" font-weight="bold">launchd (PID: 1)</text>
    <text x="14" y="60" fill="#818cf8" font-family="ui-monospace, monospace" font-size="9">>_ /sbin/launchd</text>
  </g>

  <!-- Animated Edge 1 -->
  <path d="M 240 175 C 290 175, 290 175, 340 175" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="6,4"/>
  <polygon points="340,175 330,170 330,180" fill="#3b82f6"/>

  <!-- Node 2: Target (e.g. Node Server) -->
  <g transform="translate(340, 130)" filter="url(#nodeGlow)">
    <rect width="220" height="90" rx="12" fill="#172554" stroke="#3b82f6" stroke-width="2"/>
    <text x="14" y="26" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="bold">TARGET PROCESS</text>
    <text x="14" y="48" fill="#ffffff" font-family="ui-monospace, monospace" font-size="14" font-weight="bold">:5173 node (PID: 37823)</text>
    <text x="14" y="66" fill="#93c5fd" font-family="ui-monospace, monospace" font-size="9">>_ vite --host (witr-gui)</text>
    <text x="14" y="80" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="9">Mem: 180MB • CPU: 0.2%</text>
  </g>

  <!-- Forking Edge to Child 1 -->
  <path d="M 560 160 C 620 160, 620 100, 680 100" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="680,100 670,95 670,105" fill="#a855f7"/>

  <!-- Forking Edge to Child 2 -->
  <path d="M 560 190 C 620 190, 620 250, 680 250" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="680,250 670,245 670,255" fill="#a855f7"/>

  <!-- Child Node 1: esbuild -->
  <g transform="translate(680, 70)" filter="url(#nodeGlow)">
    <rect width="240" height="64" rx="10" fill="#2e1065" stroke="#a855f7" stroke-width="1.5"/>
    <text x="14" y="22" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="bold">CHILD (SUBPROCESS)</text>
    <text x="14" y="40" fill="#ffffff" font-family="ui-monospace, monospace" font-size="11" font-weight="bold">esbuild (PID: 37840)</text>
    <text x="14" y="54" fill="#c084fc" font-family="ui-monospace, monospace" font-size="9">Vite Compilation Daemon Worker</text>
  </g>

  <!-- Child Node 2: electron -->
  <g transform="translate(680, 220)" filter="url(#nodeGlow)">
    <rect width="240" height="64" rx="10" fill="#2e1065" stroke="#a855f7" stroke-width="1.5"/>
    <text x="14" y="22" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="bold">CHILD (SUBPROCESS)</text>
    <text x="14" y="40" fill="#ffffff" font-family="ui-monospace, monospace" font-size="11" font-weight="bold">Electron Helper (PID: 37860)</text>
    <text x="14" y="54" fill="#c084fc" font-family="ui-monospace, monospace" font-size="9">GPU Compositor &amp; Sandbox</text>
  </g>
</svg>
