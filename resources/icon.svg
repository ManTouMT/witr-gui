<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="wGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#3b82f6" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Rounded Rect Background with macOS Squircle proportion -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)" stroke="#334155" stroke-width="6"/>
  
  <!-- Inner Circuit Grid Accent -->
  <path d="M96 160 H200 M96 352 H180 M312 160 H416 M332 352 H416" stroke="#1e293b" stroke-width="4" stroke-dasharray="6,6"/>
  <circle cx="200" cy="160" r="6" fill="#3b82f6"/>
  <circle cx="180" cy="352" r="6" fill="#8b5cf6"/>
  <circle cx="312" cy="160" r="6" fill="#3b82f6"/>
  <circle cx="332" cy="352" r="6" fill="#8b5cf6"/>

  <!-- Iconic 'W' Symbol -->
  <g filter="url(#glow)">
    <path d="M128 176 L192 336 L256 208 L320 336 L384 176" 
          fill="none" 
          stroke="url(#wGrad)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Central Pivot Dot -->
    <circle cx="256" cy="208" r="10" fill="#93c5fd"/>
    <circle cx="192" cy="336" r="10" fill="#60a5fa"/>
    <circle cx="320" cy="336" r="10" fill="#60a5fa"/>
  </g>
</svg>
